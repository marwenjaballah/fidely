services:
  ingress:
    image: nginx:alpine
    container_name: fidely-ingress
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - fidely-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://fidely.localhost}
    container_name: fidely-web
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api.localhost}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://fidely.localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - fidely-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fidely-api
    expose:
      - "3000"
    env_file:
      - path: .env.development
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - API_URL=${API_URL:-http://api.localhost}
      - WEB_URL=${WEB_URL:-http://fidely.localhost}
      - ALLOWED_ORIGINS=http://localhost,http://fidely.localhost,http://pos.localhost,http://business.localhost,http://app.localhost,http://admin.localhost,http://api.localhost
    restart: unless-stopped
    networks:
      - fidely-network

networks:
  fidely-network:
    driver: bridge
